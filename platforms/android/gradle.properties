org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true

# Vard project to bundle, relative to the repository root.
vard.app=examples/todo
# ABIs passed to `cargo ndk -t` (comma-separated). arm64-v8a: devices, x86_64: emulator.
vard.abis=arm64-v8a,x86_64
# Set to true to skip the cargo step and use libraries already in app/src/main/jniLibs.
vard.skipCargo=false
