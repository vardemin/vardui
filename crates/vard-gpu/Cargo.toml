[package]
name = "vard-gpu"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GPU renderer for Vard frames (wgpu: Metal, Vulkan, DX12, GL) and the Apple host library"

[lib]
name = "vard_gpu"
crate-type = ["staticlib", "rlib"]

[dependencies]
vard-runtime = { path = "../vard-runtime" }
vard-ffi = { path = "../vard-ffi" }
wgpu = { version = "30", default-features = false, features = ["wgsl", "metal", "vulkan", "gles", "dx12", "std"] }
pollster = "1"
bytemuck = { version = "1", features = ["derive"] }
fontdue = "0.9"
tiny-skia = { version = "0.11", default-features = false, features = ["std", "png-format"] }

[dev-dependencies]
vard-lang = { path = "../vard-lang" }
