[package]
name = "vard-web"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Web host for Vard apps: the core and the GPU renderer as WebAssembly (WebGPU, WebGL2)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
vard-runtime = { path = "../vard-runtime" }
vard-ffi = { path = "../vard-ffi" }
vard-gpu = { path = "../vard-gpu" }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "30", default-features = false, features = ["wgsl", "webgpu", "webgl", "std"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["HtmlCanvasElement"] }
