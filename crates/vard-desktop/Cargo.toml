[package]
name = "vard-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Desktop host for Vard apps (Windows, Linux, macOS): a window drawn by the GPU renderer"

[[bin]]
name = "vard-desktop"
path = "src/main.rs"

[dependencies]
vard-runtime = { path = "../vard-runtime" }
vard-ffi = { path = "../vard-ffi" }
vard-gpu = { path = "../vard-gpu" }
vard-pkg = { path = "../vard-pkg" }
wgpu = { version = "30", default-features = false, features = ["wgsl", "metal", "vulkan", "gles", "dx12", "std"] }
winit = "0.30"
pollster = "1"
serde_json = "1"
