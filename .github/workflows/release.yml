# Push a tag `vX.Y.Z` → a GitHub release with `vard` binaries for Linux, macOS and Windows.
# Assets: vard-<target>.tar.gz (vard-<target>.zip on Windows) + .sha256 files; the install
# scripts (install.sh, install.ps1) and the public registry's CI download these.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "VardUI $GITHUB_REF_NAME" --generate-notes --verify-tag

  build:
    needs: create
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: bash
        run: |
          rustup target add ${{ matrix.target }}
          cargo build --release --locked -p vard-cli --target ${{ matrix.target }}
      - name: Package and upload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd target/${{ matrix.target }}/release
          name=vard-${{ matrix.target }}
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a -tzip "$name.zip" vard.exe >/dev/null
            file="$name.zip"
          else
            tar -czf "$name.tar.gz" vard
            file="$name.tar.gz"
          fi
          if command -v sha256sum >/dev/null; then sha256sum "$file" > "$file.sha256"; else shasum -a 256 "$file" > "$file.sha256"; fi
          gh release upload "$GITHUB_REF_NAME" "$file" "$file.sha256" --clobber

  # vard.mcpb and the MCP Registry entry: the same steps as mcp.yml
  mcp:
    needs: build
    uses: ./.github/workflows/mcp.yml
    with:
      tag: ${{ github.ref_name }}
    permissions:
      contents: write
      id-token: write
