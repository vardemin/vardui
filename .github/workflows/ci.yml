# Tests on every push and pull request: the Rust workspace, then `vard test` on every
# example app and bundled package (the same checks CLAUDE.md asks for).
name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      # never reach the public registry from tests
      VARD_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: cargo test --workspace
      - name: vard test (examples and packages)
        shell: bash
        run: |
          cargo build --release -p vard-cli
          for e in examples/* packages/*; do ./target/release/vard test "$e"; done
      - name: Swift bindings typecheck
        if: runner.os == 'macOS'
        run: |
          ./target/release/vard bindings packages/firebase --swift --class FirebaseModule --out "$RUNNER_TEMP/FirebaseModule.swift"
          swiftc -typecheck "$RUNNER_TEMP/FirebaseModule.swift"
      - name: Apple host (xcframework + swift test)
        if: runner.os == 'macOS'
        run: |
          platforms/apple/build-xcframework.sh --macos
          cd platforms/apple && swift test
      - name: Web host (wasm)
        if: runner.os == 'Linux'
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build -p vard-web --release --target wasm32-unknown-unknown
      - name: Android library with the GPU renderer
        if: runner.os == 'Linux'
        run: |
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --locked
          ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" cargo ndk -t arm64-v8a -P 26 build -p vard-ffi --features gpu
